name: Generate profile summary cards

on:
  schedule:
    - cron: "43 0 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Optional: add a personal access token as the repo secret SUMMARY_GITHUB_TOKEN
          # to include private-repo stats. Otherwise the built-in token is used.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: master
          UTC_OFFSET: 5.5
          AUTO_PUSH: true
